<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الحساب</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0879d1"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--blue:#0879d1;--blue2:#0b65b7;--green:#12a95a;--red:#e53935;--bg:#f5f7fb;--text:#16202a;--muted:#6b7785;--card:#fff;--line:#e5e9ef}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 18px 20px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}header .top{display:flex;justify-content:space-between;align-items:center}header h1{font-size:21px;margin:0}.person{font-size:14px;opacity:.9;margin-top:4px}
main{padding:16px;padding-bottom:92px}.balance{background:#fff;border-radius:18px;padding:22px;text-align:center;box-shadow:0 4px 18px #0000000b;margin-bottom:14px}.balance .label{color:var(--muted);font-size:15px}.amount{font-size:43px;font-weight:800;color:var(--red);margin:6px 0}.amount.ok{color:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}.btn:active{transform:scale(.98)}.debt{background:var(--blue)}.pay{background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#fff;border-radius:13px;padding:12px 7px;text-align:center;border:1px solid var(--line)}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:10px;border:1px solid var(--line)}.cardhead{display:flex;justify-content:space-between;gap:10px}.type{font-weight:800}.debttext{color:var(--red)}.paytext{color:var(--green)}.money{font-weight:800;font-size:19px}.meta{color:var(--muted);font-size:12px;margin-top:7px}.note{font-size:13px;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:30px}.operation-card{cursor:pointer}.operation-card:focus{outline:2px solid var(--blue)}.details{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.8}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.detail-box{background:#f3f7fb;border-radius:10px;padding:10px}.detail-box small{display:block;color:var(--muted);font-size:11px}.detail-box strong{display:block;overflow-wrap:anywhere}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#e5f8ec;color:#08783c;font-weight:700}.pill.pending{background:#fff0ee;color:#b42318}.details ul{padding-right:20px;margin:6px 0}.toggle-hint{font-size:11px;color:var(--muted);margin-top:8px}.serial{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.3px;padding:4px 7px;border-radius:7px;background:#eaf3ff;color:#064b9b;margin-bottom:6px;direction:ltr}.serial.debtserial{background:#fff0ee;color:#b42318}.alloc-box{background:#f0faf4;border:1px solid #c9efd8;border-radius:10px;padding:10px;margin:8px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{background:none;border:0;padding:8px;color:var(--muted);font-size:12px;cursor:pointer}nav button.active{color:var(--blue);font-weight:800}nav .ico{font-size:21px;display:block}
.section{display:none}.section.active{display:block}.row{display:flex;gap:8px}.row>*{flex:1}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.input,select{width:100%;padding:13px;border:1px solid #d7dde5;border-radius:11px;font-size:16px;background:#fff}.primary{width:100%;background:var(--blue);margin-top:5px}.secondary{width:100%;background:#eef4fb;color:var(--blue);margin-top:8px}.danger{width:100%;background:#fff0f0;color:var(--red);border:1px solid #ffd1d1;margin-top:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters .full{grid-column:1/-1}.resultbar{font-size:13px;color:var(--muted);margin:10px 0}.small{font-size:12px;color:var(--muted)}.settings-item{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--line)}.settings-item button{border:0;border-radius:9px;padding:9px 12px;background:#edf4fb;color:var(--blue);font-weight:700}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;border-radius:20px 20px 0 0;width:min(520px,100%);margin:auto;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 16px}.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:18px}
@media(min-width:600px){body{padding:20px}.app{border-radius:20px;overflow:hidden;box-shadow:0 8px 35px #0002}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div><h1>دفتر الحساب</h1><div class="person" id="personName">حساب الشخص</div></div><div>💼</div></div></header>
<main>
<section id="home" class="section active">
<div class="balance"><div class="label">الرصيد الحالي</div><div id="balance" class="amount">0 $</div><div class="small">المبلغ المتبقي عليه للشخص</div></div>
<div class="actions"><button class="btn debt" onclick="openEntry('debt')">＋ بضاعة / دين</button><button class="btn pay" onclick="openEntry('payment')">💵 دفعة</button></div>
<div class="stats"><div class="stat"><b id="totalDebt">0 $</b><span>إجمالي البضاعة</span></div><div class="stat"><b id="totalPaid">0 $</b><span>إجمالي الدفعات</span></div><div class="stat"><b id="opCount">0</b><span>عدد العمليات</span></div></div>
<h3>آخر العمليات</h3><div id="recent"></div>
</section>
<section id="history" class="section"><h2>سجل العمليات</h2><div class="filters"><div class="field"><label>من تاريخ</label><input id="fromDate" class="input" type="date"></div><div class="field"><label>إلى تاريخ</label><input id="toDate" class="input" type="date"></div><div class="field full"><label>نوع العملية</label><select id="typeFilter"><option value="all">الكل</option><option value="debt">بضاعة / دين</option><option value="payment">دفعة</option></select></div><div class="field full"><label>بحث بالملاحظة</label><input id="searchText" class="input" placeholder="اكتب كلمة للبحث..."></div></div><button class="btn primary" onclick="renderHistory()">عرض النتائج</button><div id="resultbar" class="resultbar"></div><div id="historyList"></div></section>
<section id="settings" class="section"><h2>الإعدادات</h2><div class="card"><div class="field"><label>اسم الشخص</label><input id="nameInput" class="input" placeholder="مثلاً: أحمد"></div><button class="btn primary" onclick="saveName()">حفظ</button></div><div class="card"><div class="settings-item"><span>نسخة احتياطية</span><button onclick="backup()">تصدير</button></div><div class="settings-item"><span>استعادة البيانات</span><button onclick="document.getElementById('restoreFile').click()">استيراد</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restore(event)"></div><div class="settings-item"><span>حذف كل البيانات</span><button style="background:#fff0f0;color:#d22" onclick="clearAll()">حذف</button></div></div><div class="small">كل البيانات محفوظة محلياً على هذا الجهاز ولا تحتاج إلى إنترنت.</div></section>
</main>
<nav><button class="active" data-tab="home" onclick="showTab('home',this)"><span class="ico">🏠</span>الرئيسية</button><button data-tab="history" onclick="showTab('history',this)"><span class="ico">📋</span>السجل</button><button data-tab="settings" onclick="showTab('settings',this)"><span class="ico">⚙️</span>الإعدادات</button></nav>
</div>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">إضافة</h2><div class="field"><label>المبلغ ($)</label><input id="entryAmount" class="input" inputmode="decimal" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>ملاحظة (اختياري)</label><input id="entryNote" class="input" placeholder="مثلاً: بضاعة جديدة"></div><button id="saveEntry" class="btn primary">حفظ العملية</button><div id="paymentInfo" class="small" style="margin-top:10px"></div></div></div>
<script>
const KEY='debt_book_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{name:'حساب الشخص',entries:[]};
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' $';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const dateText=ts=>new Date(ts).toLocaleDateString('ar-LB')+' '+new Date(ts).toLocaleTimeString('ar-LB',{hour:'2-digit',minute:'2-digit'});
function ledger(){
 const debts=data.entries.filter(e=>e.type==='debt').slice().sort((a,b)=>a.ts-b.ts);
 const payments=data.entries.filter(e=>e.type==='payment').slice().sort((a,b)=>a.ts-b.ts);
 const paidByDebt={}; const allocationsByPayment={}; debts.forEach(d=>paidByDebt[d.id]=0);
 for(const p of payments){let left=Math.max(0,Number(p.amount)||0);const allocations=[];
   for(const d of debts){if(d.ts>p.ts)continue;if(left<=0.000001)break;const remaining=Math.max(0,Math.round((d.amount-(paidByDebt[d.id]||0))*100)/100);if(remaining<=0)continue;const amount=Math.min(left,remaining);if(amount>0){allocations.push({debtId:d.id,description:d.note||'بضاعة / دين',amount});paidByDebt[d.id]=(paidByDebt[d.id]||0)+amount;left=Math.round((left-amount)*100)/100;}}
   allocationsByPayment[p.id]={allocations,unallocated:Math.max(0,left)};
 }
 return {debts,payments,paidByDebt,allocationsByPayment};
}
function serialFor(e){const type=e.type;const rows=data.entries.filter(x=>x.type===type).slice().sort((a,b)=>(a.ts-b.ts)||String(a.id).localeCompare(String(b.id)));const n=rows.findIndex(x=>x.id===e.id)+1;return (type==='debt'?'D':'P')+String(n).padStart(3,'0')}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function balance(){return Math.max(0,Math.round((data.entries.reduce((s,e)=>s+(e.type==='debt'?Number(e.amount):-Number(e.amount)),0))*100)/100)}
function render(){document.getElementById('personName').textContent=data.name||'حساب الشخص';document.getElementById('nameInput').value=data.name||'حساب الشخص';const b=balance();const el=document.getElementById('balance');el.textContent=money(b);el.className='amount '+(b<=0?'ok':'');document.querySelector('.balance .small').textContent=b>0?'المبلغ المتبقي عليه للشخص':'لا يوجد دين مستحق';
const td=data.entries.filter(e=>e.type==='debt').reduce((s,e)=>s+Number(e.amount),0),tp=data.entries.filter(e=>e.type==='payment').reduce((s,e)=>s+Number(e.amount),0);document.getElementById('totalDebt').textContent=money(td);document.getElementById('totalPaid').textContent=money(tp);document.getElementById('opCount').textContent=data.entries.length;const r=[...data.entries].sort((a,b)=>b.ts-a.ts).slice(0,5);document.getElementById('recent').innerHTML=r.length?r.map(card).join(''):'<div class="empty">لا توجد عمليات بعد</div>';bindCards(document.getElementById('recent'));}
function card(e){const d=new Date(e.ts);const isDebt=e.type==='debt';const type=isDebt?'📦 بضاعة / دين':'💵 دفعة';const serial=serialFor(e);return `<div class="card operation-card" role="button" tabindex="0" aria-expanded="false" data-entry-id="${esc(e.id)}"><div class="cardhead"><div><span class="serial ${isDebt?'debtserial':''}">#${serial}</span><div class="type ${isDebt?'debttext':'paytext'}">${type}</div><div class="meta">${d.toLocaleDateString('ar-LB')} ${d.toLocaleTimeString('ar-LB',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="money ${isDebt?'debttext':'paytext'}">${isDebt?'+':'-'}${money(e.amount)}</div></div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}<div class="toggle-hint">اضغط لعرض تفاصيل العملية ⌄</div><div class="details" hidden>${operationDetails(e)}</div></div>`}
function operationDetails(e){const L=ledger();if(e.type==='debt'){const paid=Math.round((L.paidByDebt[e.id]||0)*100)/100;const remaining=Math.max(0,Math.round((Number(e.amount)-paid)*100)/100);const payRows=L.payments.map(p=>({p,amount:(L.allocationsByPayment[p.id]?.allocations||[]).filter(a=>a.debtId===e.id).reduce((s,a)=>s+a.amount,0)})).filter(x=>x.amount>0);return `<div class="detail-grid"><div class="detail-box"><small>رقم الدين المتسلسل</small><strong>#${serialFor(e)}</strong></div><div class="detail-box"><small>قيمة الدين الأصلية</small><strong>${money(e.amount)}</strong></div><div class="detail-box"><small>المدفوع منه</small><strong>${money(paid)}</strong></div><div class="detail-box"><small>المتبقي</small><strong>${money(remaining)}</strong></div><div class="detail-box"><small>تاريخ الدين</small><strong>${esc(dateText(e.ts))}</strong></div><div class="detail-box"><small>الحالة</small><strong><span class="pill ${remaining>0?'pending':''}">${remaining<=0?'مدفوع بالكامل':'باقي '+money(remaining)}</span></strong></div></div><strong>الدفعات التي سددت هذا الدين:</strong>${payRows.length?`<ul>${payRows.map(x=>`<li>الدفعة <strong>#${serialFor(x.p)}</strong> بتاريخ ${esc(dateText(x.p.ts))}: سددت ${money(x.amount)} من هذا الدين${x.p.note?' — '+esc(x.p.note):''}</li>`).join('')}</ul>`:'<p class="small">لم تُسجّل دفعات لهذا الدين بعد.</p>'}`}
const alloc=L.allocationsByPayment[e.id]||{allocations:[],unallocated:0};return `<div class="detail-grid"><div class="detail-box"><small>رقم الدفعة المتسلسل</small><strong>#${serialFor(e)}</strong></div><div class="detail-box"><small>قيمة الدفعة</small><strong>${money(e.amount)}</strong></div><div class="detail-box"><small>تاريخ الدفعة</small><strong>${esc(dateText(e.ts))}</strong></div><div class="detail-box"><small>الملاحظة</small><strong>${esc(e.note||'—')}</strong></div></div><strong>توزيع الدفعة من أقدم دين إلى الأحدث (FIFO):</strong>${alloc.allocations.length?`<ul>${alloc.allocations.map(a=>{const d=L.debts.find(x=>x.id===a.debtId);const rem=Math.max(0,Math.round((Number(d?.amount||0)-(L.paidByDebt[a.debtId]||0))*100)/100);return `<li><strong>الدين #${d?serialFor(d):'—'}</strong> (${esc(a.description)}): خُصّص له ${money(a.amount)} من الدفعة. تاريخ الدين: ${d?esc(dateText(d.ts)):'—'}. الحالة الآن: ${rem<=0?'تم تسديد الدين بالكامل':'تم تسديد جزء منه، والمتبقي '+money(rem)}.</li>`}).join('')}</ul>`:'<p class="small">لا يوجد دين يمكن تخصيص هذه الدفعة له.</p>'}${alloc.unallocated>0.001?`<p class="pill pending">مبلغ غير موزّع: ${money(alloc.unallocated)} — قد يكون ناتجًا عن بيانات قديمة.</p>`:''}`}
function bindCards(root){root.querySelectorAll('.operation-card').forEach(el=>{const toggle=()=>{const p=el.querySelector('.details');p.hidden=!p.hidden;el.setAttribute('aria-expanded',String(!p.hidden));const hint=el.querySelector('.toggle-hint');if(hint)hint.textContent=p.hidden?'اضغط لعرض تفاصيل العملية ⌄':'اضغط لإخفاء التفاصيل ⌃'};el.addEventListener('click',ev=>{if(ev.target.closest('button'))return;toggle()});el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}})})}
function showTab(id,btn){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(id==='history')renderHistory();}
let mode='debt';function openEntry(m){mode=m;document.getElementById('modalTitle').textContent=m==='debt'?'إضافة بضاعة / دين':'إضافة دفعة';document.getElementById('entryAmount').value='';document.getElementById('entryNote').value='';document.getElementById('paymentInfo').textContent=m==='payment'?'سيتم توزيع الدفعة تلقائياً على أقدم دين غير مسدّد أولاً.':'';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('entryAmount').focus(),100)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('saveEntry').onclick=()=>{const amount=Math.round(parseFloat(document.getElementById('entryAmount').value)*100)/100;if(!Number.isFinite(amount)||amount<=0){alert('أدخل مبلغاً صحيحاً');return}if(mode==='payment'&&amount>balance()+0.000001){alert('مبلغ الدفعة أكبر من الرصيد المتبقي ('+money(balance())+'). لم يتم حفظها.');return}const entry={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),type:mode,amount,note:document.getElementById('entryNote').value.trim(),ts:Date.now()};data.entries.push(entry);save();closeModal();if(mode==='payment'){const L=ledger();const alloc=L.allocationsByPayment[entry.id]||{allocations:[],unallocated:0};let msg='تم تسجيل الدفعة #'+serialFor(entry)+' بنجاح ('+money(amount)+').\n\nتفاصيل توزيع الدفعة:';if(alloc.allocations.length){for(const a of alloc.allocations){const d=L.debts.find(x=>x.id===a.debtId);const rem=Math.max(0,Math.round((Number(d?.amount||0)-(L.paidByDebt[a.debtId]||0))*100)/100);msg+='\n\n• تم تخصيص '+money(a.amount)+' للدين #'+(d?serialFor(d):'—')+'.';msg+=rem<=0?' تم تسديد هذا الدين بالكامل.':' تم تسديد جزء من الدين، والمتبقي '+money(rem)+'.';}}else{msg+='\nلا يوجد دين مستحق لتوزيع الدفعة عليه.';}if(alloc.unallocated>0.001)msg+='\nمبلغ غير موزّع: '+money(alloc.unallocated);alert(msg);}else{alert('تم تسجيل الدين #'+serialFor(entry)+' بنجاح.\nالقيمة: '+money(amount));}};
function renderHistory(){let arr=[...data.entries].sort((a,b)=>b.ts-a.ts);const f=document.getElementById('fromDate').value,t=document.getElementById('toDate').value,type=document.getElementById('typeFilter').value,q=document.getElementById('searchText').value.trim().toLowerCase();if(f)arr=arr.filter(e=>new Date(e.ts).toISOString().slice(0,10)>=f);if(t)arr=arr.filter(e=>new Date(e.ts).toISOString().slice(0,10)<=t);if(type!=='all')arr=arr.filter(e=>e.type===type);if(q)arr=arr.filter(e=>(e.note||'').toLowerCase().includes(q));document.getElementById('resultbar').textContent=`عدد النتائج: ${arr.length} — اضغط على العملية لعرض التفاصيل`;const list=document.getElementById('historyList');list.innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">لا توجد نتائج</div>';bindCards(list)}
function saveName(){const n=document.getElementById('nameInput').value.trim();data.name=n||'حساب الشخص';save();alert('تم الحفظ')}
function backup(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='debt-book-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.entries||!Array.isArray(x.entries))throw 0;data=x;save();alert('تمت استعادة البيانات')}catch{alert('ملف غير صالح')}};r.readAsText(file);ev.target.value=''}
function clearAll(){if(confirm('حذف جميع العمليات؟ لا يمكن التراجع عن هذا الإجراء.')){data.entries=[];save()}}
render();
</script><script>
// Register the service worker without allowing the browser HTTP cache to hide newer versions.
if ('serviceWorker' in navigator) {
  let reloadedForWorker = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloadedForWorker) return;
    reloadedForWorker = true;
    // All account changes are written synchronously to localStorage before this reload.
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      const check = () => reg.update().catch(() => {});
      check();
      setInterval(check, 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    } catch (err) { console.warn('تعذّر فحص تحديث التطبيق', err); }
  });
}
</script></body></html>
