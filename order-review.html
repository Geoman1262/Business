<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>مراجعة طلب | دفتر الحساب</title><style>body{margin:0;background:#f3f6fb;color:#172b4d;font-family:system-ui,sans-serif}.top{background:#102a43;color:white;padding:22px 16px}.wrap{max-width:650px;margin:auto;padding:16px}h1{font-size:23px;margin:0 0 4px}.card{background:#fff;border:1px solid #e1e8f0;border-radius:16px;padding:20px;margin-top:16px}.muted{color:#66788d;font-size:14px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.cell{background:#f5f8fc;border-radius:10px;padding:12px}.label{color:#66788d;font-size:12px;margin-bottom:5px}.value{font-weight:700;overflow-wrap:anywhere}button{border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;color:#fff;flex:1}.green{background:#16804a}.red{background:#b42318}.actions{display:flex;gap:10px;margin-top:18px}.back{display:block;text-align:center;text-decoration:none;background:#e7eef6;color:#102a43;border-radius:10px;padding:12px 16px;font-weight:700;margin:0 0 12px}.msg{display:none;padding:12px;background:#fff3cd;border-radius:10px;white-space:pre-wrap;margin-top:12px}@media(max-width:420px){.info{grid-template-columns:1fr 1fr}.actions{flex-direction:column}}</style><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="top"><div class="wrap"><h1>مراجعة طلب العميل</h1><div style="color:#d5e4f0">راجع البيانات ثم اختر موافقة أو رفض</div></div></header><main class="wrap"><a class="back" href="/index.html">↩ العودة إلى التطبيق</a><section class="card"><div id="loading" class="muted">جاري تحميل الطلب...</div><div id="content" hidden><div class="info"><div class="cell"><div class="label">اسم العميل</div><div class="value" id="name"></div></div><div class="cell"><div class="label">رقم الهاتف</div><div class="value" id="phone"></div></div><div class="cell"><div class="label">المبلغ المطلوب</div><div class="value" id="amount"></div></div><div class="cell"><div class="label">الرصيد الحالي</div><div class="value" id="balance"></div></div><div class="cell"><div class="label">المتاح ائتمانياً</div><div class="value" id="available"></div></div><div class="cell"><div class="label">تاريخ الطلب</div><div class="value" id="date"></div></div><div class="cell" style="grid-column:1/-1"><div class="label">تفاصيل الطلب</div><div class="value" id="details"></div></div><div class="cell" style="grid-column:1/-1"><div class="label">حالة الطلب</div><div class="value" id="status"></div></div></div><p class="muted">الموافقة تسجّل المبلغ كدين مرة واحدة. الرفض لا يضيف أي عملية.</p><div class="actions"><button id="approve" class="green">موافقة وتسجيل الدين</button><button id="reject" class="red">رفض الطلب</button></div></div><div id="msg" class="msg"></div></section></main><script>const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';let order=null;function msg(t){$('msg').textContent=t;$('msg').style.display='block'}function money(n){return '$'+Number(n||0).toFixed(2)}async function load(){try{const r=await fetch('/api/order-review?token='+encodeURIComponent(token));const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر رجّع صفحة HTML بدل بيانات الطلب. تأكد من نشر Worker والملفات الجديدة.');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذّر تحميل الطلب.');order=d;$('loading').hidden=true;$('content').hidden=false;$('name').textContent=d.client_name;$('phone').textContent=d.client_phone||'—';$('amount').textContent=money(d.amount);$('balance').textContent=money(d.balance);$('available').textContent=money(d.available);$('date').textContent=new Date(d.created_at).toLocaleString('ar-LB');$('details').textContent=d.details;$('status').textContent=d.status==='pending'?'بانتظار القرار':d.status==='approved'?'تمت الموافقة':d.status==='rejected'?'مرفوض':'قيد المعالجة';if(d.status!=='pending'){$('approve').disabled=true;$('reject').disabled=true;$('approve').style.opacity=$('reject').style.opacity='.5';msg('هذا الطلب تمت معالجته مسبقاً.')} }catch(e){$('loading').textContent=e.message}}async function act(action){if(!order||order.status!=='pending')return;const confirmText=action==='approve'?'تأكيد تسجيل الدين في حساب العميل؟':'تأكيد رفض الطلب؟';if(!confirm(confirmText))return;$('approve').disabled=$('reject').disabled=true;try{const r=await fetch('/api/order-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action})});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر رجّع HTML بدل JSON.');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذرت معالجة الطلب.');order.status=action==='approve'?'approved':'rejected';$('status').textContent=action==='approve'?'تمت الموافقة وتسجيل الدين':'تم رفض الطلب';msg(action==='approve'?'تمت الموافقة وتسجيل الدين مرة واحدة.':'تم رفض الطلب ولم يُضف أي دين.')}catch(e){msg(e.message);$('approve').disabled=$('reject').disabled=false}}$('approve').onclick=()=>act('approve');$('reject').onclick=()=>act('reject');load();</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
