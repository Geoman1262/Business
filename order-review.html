<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>مراجعة طلب العميل</title><style>
:root{color-scheme:dark;--line:#b7d9ff55;--muted:#a9c4e7}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at 10% 10%,#0b4b8a,#061329 55%,#020914);color:#f3f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto}.card{padding:22px;border:1px solid #c7e7ff80;border-radius:24px;background:linear-gradient(130deg,#ffffff20,#0c2852c9);box-shadow:0 16px 45px #0005;backdrop-filter:blur(18px)}h1{font-size:23px;margin:0 0 7px}p{color:var(--muted);line-height:1.6}.grid{display:grid;gap:13px;margin:18px 0}.item{padding:12px;border:1px solid #b8d7ff33;border-radius:13px;background:#ffffff08}.item small{display:block;color:var(--muted);margin-bottom:5px}.item strong{overflow-wrap:anywhere}label{display:block;font-size:13px;color:#c8defb;margin-top:14px}input,textarea{width:100%;margin-top:6px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#061a35;color:white;font:inherit}textarea{min-height:110px;resize:vertical}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:13px;padding:13px;color:white;font:inherit;font-weight:850;cursor:pointer}.approve{background:linear-gradient(110deg,#008c65,#00bd86)}.reject{background:linear-gradient(110deg,#a92742,#e4475f)}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px}.msg.show{display:block}.error{background:#ff5a671b;border:1px solid #ff697a80;color:#ffd9df}.ok{background:#00dfa21b;border:1px solid #00dfa266;color:#caffee}.hidden{display:none!important}@media(max-width:420px){body{padding:11px}.card{padding:16px}.buttons{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><h1>مراجعة طلب العميل</h1><p>راجع الطلب وعدّل المبلغ والتفاصيل إذا لزم الأمر. لن يُسجّل في الحساب إلا بعد الموافقة، وسيُعاد فحص الحد الائتماني قبل التسجيل.</p><div id="content"><p>جارٍ تحميل الطلب…</p></div><div id="msg" class="msg" role="status"></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),token=new URLSearchParams(location.search).get('token')||'';let order=null;
function showMsg(text,ok=false){$('msg').className='msg show '+(ok?'ok':'error');$('msg').textContent=text}
async function load(){if(!/^[a-f0-9]{64}$/.test(token)){$('content').innerHTML='<div class="msg show error">رابط المراجعة غير صالح.</div>';return}try{const r=await fetch('/api/order-review?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تحميل الطلب');order=j;render()}catch(e){$('content').innerHTML='<div class="msg show error">'+esc(e.message)+'</div>'}}
function render(){const pending=order.status==='pending';$('content').innerHTML=`<div class="grid"><div class="item"><small>اسم العميل</small><strong>${esc(order.client_name)}</strong></div><div class="item"><small>الرصيد الحالي</small><strong>${money(order.balance)}</strong></div><div class="item"><small>الحد الائتماني المتبقي الآن</small><strong>${money(order.available)}</strong></div><div class="item"><small>حالة الطلب</small><strong>${order.status==='pending'?'بانتظار الموافقة':order.status==='approved'?'تمت الموافقة والتسجيل':'مرفوض'}</strong></div></div><label>المبلغ بالدولار (إجباري)<input id="amount" type="number" min="0.01" step="0.01" required value="${Number(order.amount).toFixed(2)}" ${pending?'':'disabled'}></label><label>التفاصيل (إجبارية)<textarea id="details" maxlength="1000" required ${pending?'':'disabled'}>${esc(order.details)}</textarea></label><div class="item" style="margin-top:12px"><small>المتبقي من الحد بعد الطلب المعدّل</small><strong id="after">${money(Math.max(0,order.available-Number(order.amount)))}</strong></div>${pending?'<div class="buttons"><button class="approve" id="approve">موافقة وتسجيل</button><button class="reject" id="reject">رفض الطلب</button></div>':''}`;
if(pending){const a=$('amount');const d=$('details');function calc(){const n=Number(a.value),valid=a.value!==''&&Number.isFinite(n)&&n>0&&Math.round(n*100)===n*100;$('after').textContent=money(Math.max(0,order.available-(valid?n:0)));$('after').style.color=valid&&n>order.available?'#ff8b9a':'';a.setCustomValidity(valid&&n>order.available?'المبلغ يتجاوز المتاح ائتمانياً':'');$('approve').disabled=!valid||n>order.available||!d.value.trim();$('approve').style.opacity=$('approve').disabled?'.55':'1'}a.addEventListener('input',calc);d.addEventListener('input',calc);calc();$('approve').onclick=()=>submit('approve');$('reject').onclick=()=>{if(confirm('هل تريد رفض هذا الطلب؟'))submit('reject')}}}
async function submit(action){const b=$('approve'),amount=Number($('amount')?.value),details=$('details')?.value.trim();if(action==='approve'){if(!$('amount').reportValidity())return;if(!$('details').reportValidity())return;if(amount>order.available){showMsg('المبلغ يتجاوز الحد الائتماني المتاح حالياً.');return}}document.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await fetch('/api/order-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,amount,details})}),j=await r.json();if(!r.ok)throw Error(j.error||'تعذرت معالجة الطلب');showMsg(action==='approve'?'تمت الموافقة وتسجيل الطلب في حساب العميل.':'تم رفض الطلب. لن يُضاف إلى الحساب.',true);await load()}catch(e){showMsg(e.message);document.querySelectorAll('button').forEach(x=>x.disabled=false)}}load();
</script></body></html>
