<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>مراجعة طلب العميل</title><style>
:root{color-scheme:dark;--line:#b7d9ff55;--muted:#a9c4e7}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(circle at 10% 10%,#0b4b8a,#061329 55%,#020914);color:#f3f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto}.card{padding:22px;border:1px solid #c7e7ff80;border-radius:24px;background:linear-gradient(130deg,#ffffff20,#0c2852c9);box-shadow:0 16px 45px #0005;backdrop-filter:blur(18px)}h1{font-size:23px;margin:0 0 7px}p{color:var(--muted);line-height:1.6}.grid{display:grid;gap:13px;margin:18px 0}.item{padding:12px;border:1px solid #b8d7ff33;border-radius:13px;background:#ffffff08}.item small{display:block;color:var(--muted);margin-bottom:5px}.item strong{overflow-wrap:anywhere}label{display:block;font-size:13px;color:#c8defb;margin-top:14px}input,textarea{width:100%;margin-top:6px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#061a35;color:white;font:inherit}textarea{min-height:110px;resize:vertical}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:13px;padding:13px;color:white;font:inherit;font-weight:850;cursor:pointer}.approve{background:linear-gradient(110deg,#008c65,#00bd86)}.reject{background:linear-gradient(110deg,#a92742,#e4475f)}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px}.msg.show{display:block}.error{background:#ff5a671b;border:1px solid #ff697a80;color:#ffd9df}.ok{background:#00dfa21b;border:1px solid #00dfa266;color:#caffee}.hidden{display:none!important}@media(max-width:420px){body{padding:11px}.card{padding:16px}.buttons{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><h1>مراجعة طلب العميل</h1><p>هذه العملية جهّزها صاحب التطبيق مسبقًا من بيانات الطلب. راجع اسم العميل والمبلغ والتفاصيل، ثم اختر الموافقة أو الرفض. لن يُسجّل الدين إلا بعد موافقتك.</p><div id="content"><p>جارٍ تحميل الطلب…</p></div><div id="msg" class="msg" role="status"></div></section></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),token=new URLSearchParams(location.search).get('token')||'';let order=null;
function showMsg(text,ok=false){$('msg').className='msg show '+(ok?'ok':'error');$('msg').textContent=text}
async function load(){if(!/^[a-f0-9]{64}$/.test(token)){$('content').innerHTML='<div class="msg show error">رابط المراجعة غير صالح.</div>';return}try{const r=await fetch('/api/order-review?token='+encodeURIComponent(token),{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'تعذر تحميل الطلب');order=j;render()}catch(e){$('content').innerHTML='<div class="msg show error">'+esc(e.message)+'</div>'}}
function render(){const pending=order.status==='pending';$('content').innerHTML=`<div class="grid"><div class="item"><small>العميل المحدد تلقائيًا</small><strong>${esc(order.client_name)}</strong></div><div class="item"><small>رقم الهاتف</small><strong>${esc(order.client_phone||'—')}</strong></div><div class="item"><small>الرصيد الحالي</small><strong>${money(order.balance)}</strong></div><div class="item"><small>المبلغ المطلوب</small><strong>${money(order.amount)}</strong></div><div class="item"><small>تفاصيل العملية</small><strong>${esc(order.details)}</strong></div><div class="item"><small>حالة الطلب</small><strong>${order.status==='pending'?'بانتظار قرارك':order.status==='approved'?'تمت الموافقة والتسجيل':'مرفوض'}</strong></div></div>${pending?'<div class="buttons"><button class="approve" id="approve">موافق — تسجيل العملية</button><button class="reject" id="reject">رفض الطلب</button></div>':''}`;if(pending){$('approve').onclick=()=>submit('approve');$('reject').onclick=()=>{if(confirm('هل تريد رفض العملية؟ لن يُضاف أي دين.'))submit('reject')}}}
function syncApprovedEntry(j){try{const clients=JSON.parse(localStorage.getItem('debt_book_clients_v1')||'[]');if(!Array.isArray(clients)||!clients.length)return false;const c=clients.find(x=>x.id===j.clientId);if(!c)return false;if(!c.data||typeof c.data!=='object')c.data={name:c.name||j.clientName,entries:[]};if(!Array.isArray(c.data.entries))c.data.entries=[];const exists=c.data.entries.some(e=>e.orderId===j.orderId||e.id===j.entry.id);if(!exists)c.data.entries.push(j.entry);c.name=c.name||j.clientName;c.data.name=c.data.name||c.name;localStorage.setItem('debt_book_clients_v1',JSON.stringify(clients));if(localStorage.getItem('debt_book_active_client_v1')===j.clientId)localStorage.setItem('debt_book_v1',JSON.stringify(c.data));return true}catch(e){return false}}
async function submit(action){document.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await fetch('/api/order-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action})}),j=await r.json();if(!r.ok)throw Error(j.error||'تعذرت معالجة الطلب');if(action==='approve'&&j.entry){const synced=syncApprovedEntry(j);showMsg('تمت الموافقة وتسجيل الدين في حساب العميل.'+(synced?'':' افتح التطبيق على الجهاز الذي أُنشئ منه الطلب ثم زامن الحساب لتحديث العرض المحلي.'),true)}else showMsg('تم رفض العملية. لم يُضف أي دين.',true);await load()}catch(e){showMsg(e.message);document.querySelectorAll('button').forEach(x=>x.disabled=false)}}
load();
</script></body></html>
