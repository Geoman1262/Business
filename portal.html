-size:12px;margin-top:8px}@media(max-width:420px){.report-panel{padding:12px}.report-summary{gap:4px}.report-summary .detail-box{padding:7px}.report-actions{grid-template-columns:1fr 1fr}.report-actions button:last-child{grid-column:1/-1}}@media print{body>*{visibility:hidden}.wrap,.wrap *{visibility:visible}.wrap{position:absolute;left:0;top:0;width:100%;max-width:none;padding:0;margin:0}.top,.sub,.credit,.tabs,.transactions,.footer,.report-controls,.report-actions{display:none!important}.report-panel{display:block!important;padding:0;margin:0;background:#fff!important;color:#111!important;border:0!important}.report-title{color:#111}.report-summary .detail-box{background:#fff!important;border:1px solid #bbb!important;color:#111!important}.report-summary small,.report-note{color:#444!important}.report-table th,.report-table td{color:#111!important;border-color:#ccc!important}.report-table th{background:#eee!important}.report-table-wrap{overflow:visible}.report-table{min-width:0;font-size:10px}}body[dir="rtl"] .tx-detail{padding:0 53px 15px 3px}body[dir="rtl"] .credit-icon{right:auto;left:22px}@media(max-width:420px){body{padding:12px 9px}.credit{padding:20px 15px 17px}.stats{gap:3px}.stat{padding:0 6px}.stat small{font-size:11px}.tx summary{grid-template-columns:37px minmax(0,1fr) auto 10px;gap:7px}.txicon{width:35px;height:35px}.tx-amount{font-size:15px}.transactions{padding:5px 10px}.tx-detail{padding-left:44px}}@media print{body{background:#fff;color:#111}.glass,.transactions,.settings-panel{background:#fff!important;color:#111;box-shadow:none;border:1px solid #bbb;backdrop-filter:none}.lang,.tabs,.footer{display:none}.muted,.sub,.stat small,.tx-date,.tx-detail{color:#444}}

<script>
const I18N={en:{brand:'Account Owner',loading:'Loading account…',limit:'Credit Limit',used:'Used Credit',available:'Available Credit',remaining:'remaining',usedPct:'used',limitReached:'LIMIT REACHED',exceeded:'LIMIT EXCEEDED',overBy:'Over limit by',all:'All',viewAllTransactions:'View all transactions ↓',showLastThree:'Show last 3 transactions ↑',purchases:'Purchases',payments:'Payments',purchase:'Purchase / Debt',payment:'Payment',date:'Date',amount:'Amount',description:'Description',serial:'Reference',balanceAfter:'Balance after this transaction',currentDebt:'Current debt',paid:'Paid toward this debt',left:'Remaining on this debt',status:'Status',fullyPaid:'Paid in full',partPaid:'Partially paid',paymentAllocation:'Payment allocation',allocated:'Allocated to',noNote:'No description provided',empty:'No transactions recorded yet.',footer:'View-only account · Contact the account owner for corrections.',lastUpdate:'Last updated',reports:'Reports',fromDate:'From date',toDate:'To date',reportType:'Report type',allTypes:'All',generateReport:'Generate Report',exportCsv:'Export CSV',printPdf:'Print / Save PDF',totalDebt:'Total debt',totalPayments:'Total payments',outstanding:'Current outstanding',reportDate:'Date',reportTypeCol:'Type',reportDesc:'Description / Ref',reportAmount:'Amount',reportBalance:'Balance after',noReport:'No transactions match this report.',reportGenerated:'Report updated using the selected dates.'},ar:{brand:'صاحب الحساب',loading:'جارٍ تحميل الحساب…',limit:'الحد الائتماني',used:'الدين المستخدم',available:'المتاح للشراء',remaining:'متبقٍ',usedPct:'مستخدم',limitReached:'تم بلوغ الحد الائتماني',exceeded:'تجاوز الحد الائتماني',overBy:'التجاوز بقيمة',all:'الكل',viewAllTransactions:'عرض كل العمليات ↓',showLastThree:'عرض آخر 3 عمليات ↑',purchases:'المشتريات',payments:'الدفعات',purchase:'شراء / دين',payment:'دفعة',date:'التاريخ',amount:'المبلغ',description:'الوصف',serial:'الرقم المرجعي',balanceAfter:'الرصيد بعد هذه العملية',currentDebt:'الدين الحالي',paid:'الم const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let account=null,clientName='',language=localStorage.getItem('debt_portal_language_v1')||'en',filter='all',transactionsExpanded=false,token='';const $=id=>document.getElementById(id);const t=k=>I18N[language][k]||k;const date=ts=>{const d=new Date(Number(ts));return isNaN(d)?'—':d.toLocaleString(language==='ar'?'ar-LB':'en-US',{dateStyle:'medium',timeStyle:'short'})};
function setLanguage(lang){language=lang;localStorage.setItem('debt_portal_language_v1',lang);document.documentElement.lang=lang==='ar'?'ar':'en';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=document.documentElement.dir;$('enBtn').classList.toggle('active',lang==='en');$('arBtn').classList.toggle('active',lang==='ar');if(account)render();else applyStatic();}
function applyStatic(){$('brand').textContent=clientName||t('brand');$('footer').textContent=t('footer');$('updated').textContent=t('loading');}
$('enBtn').onclick=()=>setLanguage('en');$('arBtn').onclick=()=>setLanguage('ar');
function calc(){const entries=(Array.isArray(account.entries)?account.entries:[]).slice().sort((a,b)=>Number(a.ts)-Number(b.ts));const debts=entries.filter(e=>e.type==='debt'),payments=entries.filter(e=>e.type==='payment');const paid={};debts.forEach(d=>paid[d.id]=0);const allocations={};for(const p of payments){let left=Math.max(0,Number(p.amount)||0);const rows=[];for(const d of debts){if(Number(d.ts)>Number(p.ts)||left<=0)continue;const rem=Math.max(0,Math.round((Number(d.amount)-paid[d.id])*100)/100);if(!rem)continue;const amount=Math.min(left,rem);rows.push({debtId:d.id,note:d.note||'',amount});paid[d.id]=Math.round((paid[d.id]+amount)*100)/100;left=Math.round((left-amount)*100)/100;}allocations[p.id]={rows,left};}let running=0;const runningAfter={};for(const e of entries){running=Math.round((running+(e.type==='debt'?1:-1)*Number(e.amount||0))*100)/100;runningAfter[e.id]=Math.max(0,running)}const balance=Math.max(0,Math.round((debts.reduce((s,e)=>s+Number(e.amount||0),0)-payments.reduce((s,e)=>s+Number(e.amount||0),0))*100)/100);return{entries,debts,payments,paid,allocations,runningAfter,balance,debtTotal:debts.reduce((s,e)=>s+Number(e.amount||0),0),payTotal:payments.reduce((s,e)=>s+Number(e.amount||0),0)}}
function serial(e,L){const rows=L.entries.filter(x=>x.type===e.type);return(e.type==='debt'?'D':'P')+String(rows.findIndex(x=>x.id===e.id)+1).padStart(3,'0')}
function render(){const L=calc(),limit=Math.max(0,Number(account.creditLimit)||0),used=L.balance,available=Math.max(0,limit-used),remainingPct=limit>0?Math.max(0,Math.min(100,available/limit*100)):0,usedPct=limit>0?Math.min(100,used/limit*100):0,over=Math.max(0,used-limit);const entries=L.entries.slice().reverse();let html=`<section class="glass credit"><div class="limit-label">${t('limit')}</div><div class="limit">${money(limit)}</div><div class="credit-icon">▣</div><div class="bar-shell" aria-label="${Math.round(remainingPct)}% ${t('remaining')}"><div class="bar-track"><div class="bar-fill" style="width:${remainingPct}%"></div></div></div><div class="bar-caption"><span>${Math.round(remainingPct)}% ${t('remaining')}</span><span>${Math.round(usedPct)}% ${t('used')}</span></div><div class="stats"><div class="stat"><small>${t('used')}</small><strong>${money(used)}</strong></div><div class="stat"><small>${t('available')}</small><strong class="green">${money(available)}</strong></div><div class="stat"><small>${t('remaining')}</small><strong>${Math.round(remainingPct)}% <span style="font-size:14px;color:#d3e6ff">(${money(available)})</span></strong></div></div>${over>0?`<div class="alert show">${t('exceeded')} · ${t('overBy')} ${money(over)}</div>`:limit>0&&used>=limit?`<div class="alert show">${t('limitReached')} · 100% USED</div>`:''}${limit===0?`<div class="alert show" style="display:block;background:#ffffff10;border-color:#b9dcff55">${language==='ar'?'لم يحدّد صاحب الحساب حداً ائتمانياً بعد.':'The account owner has not set a credit limit yet.'}</div>`:''}</section><section class="glass report-panel"><h2 class="report-title">${t('reports')}</h2><div class="report-controls"><label>${t('fromDate')}<input id="reportFrom" type="date"></label><label>${t('toDate')}<input id="reportTo" type="date"></label><label>${t('reportType')}<select id="reportType"><option value="all">${t('allTypes')}</option><option value="debt">${t('purchases')}</option><option value="payment">${t('payments')}</option></select></label></div><div class="report-actions"><button id="generateReport">${t('generateReport')}</button><button id="exportReport" class="secondary">${t('exportCsv')}</button><button id="printReport" class="secondary">${t('printPdf')}</button></div><div class="report-results" id="reportResults"></div></section><div class="tabs"><button data-filter="all" class="${filter==='all'?'active':''}">${t('all')}</button><button data-filter="debt" class="${filter==='debt'?'active':''}">${t('purchases')}</button><button data-filter="payment" class="${filter==='payment'?'active':''}">${t('payments')}</button></div><section class="glass transactions">`;
const filteredEntries=entries.filter(e=>filter==='all'||e.type===filter);const shown=transactionsExpanded?filteredEntries:filteredEntries.slice(0,3);if(!shown.length)html+=`<div class="empty">${t('empty')}</div>`;for(const e of shown){const debt=e.type==='debt',amount=Number(e.amount)||0,balAfter=L.runningAfter[e.id]||0;let detail=`<div class="detail-grid"><div class="detail-box"><small>${t('serial')}</small><strong>${serial(e,L)}</strong></div><div class="detail-box"><small>${t('date')}</small><strong>${esc(date(e.ts))}</strong></div><div class="detail-box"><small>${t('amount')}</small><strong>${money(amount)}</strong></div><div class="detail-box"><small>${t('balanceAfter')}</small><strong>${money(balAfter)}</strong></div><div class="detail-box" style="grid-column:1/-1"><small>${t('description')}</small><strong>${esc(e.note||t('noNote'))}</strong></div></div>`;
if(debt){const paid=L.paid[e.id]||0,rem=Math.max(0,Math.round((amount-paid)*100)/100);detail+=`<div class="detail-grid"><div class="detail-box"><small>${t('paid')}</small><strong>${money(paid)}</strong></div><div class="detail-box"><small>${t('left')}</small><strong>${money(rem)}</strong></div><div class="detail-box" style="grid-column:1/-1"><small>${t('status')}</small><strong>${rem<=0?t('fullyPaid'):t('partPaid')}</strong></div></div>`;const linked=L.payments.map(p=>({p,amount:(L.allocations[p.id]?.rows||[]).filter(a=>a.debtId===e.id).reduce((s,a)=>s+a.amount,0)})).filter(x=>x.amount>0);if(linked.length)detail+=`<strong>${t('payments')}:</strong><ul>${linked.map(x=>`<li>${esc(date(x.p.ts))} · ${money(x.amount)}${x.p.note?' · '+esc(x.p.note):''}</li>`).join('')}</ul>`}
else{const al=L.allocations[e.id]||{rows:[],left:0};detail+=`<strong>${t('paymentAllocation')}:</strong>${al.rows.length?`<ul>${al.rows.map(a=>{const d=L.debts.find(x=>x.id===a.debtId);return `<li>${t('allocated')} #${d?serial(d,L):'—'} · ${esc(a.note||t('purchase'))}: ${money(a.amount)}</li>`}).join('')}</ul>`:`<p>${language==='ar'?'لا يوجد دين سابق لتوزيع هذه الدفعة عليه.':'No earlier debt was available for this payment.'}</p>`}`;if(al.left>0.001)detail+=`<p>${language==='ar'?'مبلغ غير موزّع':'Unallocated amount'}: ${money(al.left)}</p>`}
html+=`<details class="tx"><summary><span class="txicon ${debt?'':'payment'}">${debt?'🛒':'⬆'}</span><span><div class="tx-title">${debt?t('purchase'):t('payment')}</div><div class="tx-date">${esc(date(e.ts))} · #${serial(e,L)}</div></span><strong class="tx-amount ${debt?'red':'green'}">${debt?'−':'+'}${money(amount)}</strong><span class="chevron">›</span></summary><div class="tx-detail">${detail}</div></details>`}
html+=`<button type="button" id="toggleTransactions" class="toggle-transactions">${transactionsExpanded?t('showLastThree'):t('viewAllTransactions')}</button></section>`;$('app').innerHTML=html;$('app').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('toggleTransactions').onclick=()=>{transactionsExpanded=!transactionsExpanded;render()};
const localISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};
const today=localISO(new Date()),monthStart=localISO(new Date(new Date().getFullYear(),new Date().getMonth(),1));$('reportFrom').value=monthStart;$('reportTo').value=today;
let reportRows=[];
function buildReport(){const from=$('reportFrom').value,to=$('reportTo').value,typ=$('reportType').value;if(from&&to&&from>to){$('reportResults').innerHTML='<div class="error">'+(language==='ar'?'تاريخ البداية يجب أن يسبق تاريخ النهاية.':'From date must be before the to date.')+'</div>';reportRows=[];return}reportRows=L.entries.filter(e=>{const d=localISO(new Date(Number(e.ts)));return(!from||d>=from)&&(!to||d<=to)&&(typ==='all'||e.type===typ)}).sort((a,b)=>Number(a.ts)-Number(b.ts));const debtSum=reportRows.filter(e=>e.type==='debt').reduce((a,e)=>a+Number(e.amount||0),0),paySum=reportRows.filter(e=>e.type==='payment').reduce((a,e)=>a+Number(e.amount||0),0);let html=`<div class="report-summary"><div class="detail-box"><small>${t('totalDebt')}</small><strong>${money(debtSum)}</strong></div><div class="detail-box"><small>${t('totalPayments')}</small><strong class="green">${money(paySum)}</strong></div><div class="detail-box"><small>${t('outstanding')}</small><strong>${money(L.balance)}</strong></div></div><div class="report-note">${esc(from||'—')} — ${esc(to||'—')} · ${reportRows.length} ${language==='ar'?'حركة':'transactions'}</div>`;if(!reportRows.length)html+=`<div class="empty">${t('noReport')}</div>`;else{html+='<div class="report-table-wrap"><table class="report-table"><thead><tr><th>'+t('reportDate')+'</th><th>'+t('reportTypeCol')+'</th><th>'+t('reportDesc')+'</th><th class="num">'+t('reportAmount')+'</th><th class="num">'+t('reportBalance')+'</th></tr></thead><tbody>';for(const e of reportRows){html+=`<tr><td>${esc(date(e.ts))}</td><td>${e.type==='debt'?t('purchase'):t('payment')}</td><td>${esc(e.note||serial(e,L))} · #${serial(e,L)}</td><td class="num ${e.type==='debt'?'red':'green'}">${e.type==='debt'?'−':'+'}${money(e.amount)}</td><td class="num">${money(L.runningAfter[e.id]||0)}</td></tr>`}html+='</tbody></table></div>'}$('reportResults').innerHTML=html}
$('generateReport').onclick=buildReport;$('exportReport').onclick=()=>{buildReport();if(!reportRows.length)return;const rows=[[t('reportDate'),t('reportTypeCol'),t('reportDesc'),t('reportAmount'),t('reportBalance')],...reportRows.map(e=>[date(e.ts),e.type==='debt'?t('purchase'):t('payment'),(e.note||'')+' #'+serial(e,L),(e.type==='debt'?'-':'+')+Number(e.amount||0),Number(L.runningAfter[e.id]||0)])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='customer-report-'+( $('reportFrom').value||'all')+'-'+($('reportTo').value||'all')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('printReport').onclick=()=>{buildReport();window.print()};buildReport();} 
async function load(){token=new URLSearchParams(location.search).get('token')||'';if(!token){$('app').innerHTML='<div class="error">Invalid customer link.</div>';return}try{const r=await fetch('/api/portal?token='+encodeURIComponent(token),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Could not load account');account=j.account;clientName=String(j.name||j.account?.name||'').trim();$('brand').textContent=clientName||t('brand');document.title=clientName||t('brand');$('updated').textContent=t('lastUpdate')+': '+new Date(j.updatedAt).toLocaleString(language==='ar'?'ar-LB':'en-US');render()}catch(e){$('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
applyStatic();setLanguage(language);load();setInterval(load,30000);
</script></body></html>
