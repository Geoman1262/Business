<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>طلب عملية | دفتر الحساب</title><style>body{margin:0;background:#f3f6fb;color:#172b4d;font-family:system-ui,sans-serif}.top{background:#102a43;color:white;padding:22px 16px}.wrap{max-width:620px;margin:auto;padding:16px}h1{font-size:23px;margin:0 0 4px}.card{background:white;border:1px solid #e1e8f0;border-radius:16px;padding:20px;margin-top:16px}label{display:block;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box}textarea{min-height:110px;resize:vertical}button,.btn{border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;background:#147d92;color:white;width:100%;text-decoration:none;display:block;text-align:center;box-sizing:border-box}.muted{color:#66788d;font-size:14px}.stat{background:#edf6f8;border-radius:12px;padding:13px;margin:12px 0}.msg{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#fff3cd;white-space:pre-wrap}.btn{margin-top:12px}.hidden{display:none}</style><link rel="manifest" href="/manifest.webmanifest"></head><body><header class="top"><div class="wrap"><h1>دفتر الحساب</h1><div style="color:#d5e4f0">تقديم طلب لصاحب الحساب</div></div></header><main class="wrap"><section class="card"><div id="loading" class="muted">جاري تحميل الحساب...</div><div id="form" class="hidden"><h2 id="welcome">أهلاً</h2><div class="stat" id="balance"></div><p class="muted">أرسل طلبك للمراجعة. لن يتغيّر حسابك إلا بعد موافقة صاحب التطبيق.</p><label for="amount">المبلغ بالدولار</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="مثلاً 25"><label for="details">تفاصيل الطلب</label><textarea id="details" placeholder="اكتب تفاصيل العملية"></textarea><button id="send">إرسال الطلب عبر واتساب</button><div class="msg" id="msg"></div></div></section></main><script>const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';async function start(){try{const r=await fetch('/api/portal?token='+encodeURIComponent(token));const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('تعذّر الاتصال بالخدمة.');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذّر فتح رابط العميل.');$('loading').classList.add('hidden');$('form').classList.remove('hidden');$('welcome').textContent='أهلاً '+d.name;$('balance').textContent=`الرصيد الحالي: $${Number(d.balance).toFixed(2)} · المتاح من الحد الائتماني: $${Number(d.available).toFixed(2)}`;$('send').onclick=async()=>{const amount=Number($('amount').value),details=$('details').value.trim();$('msg').style.display='none';if(!Number.isFinite(amount)||amount<=0){show('أدخل مبلغاً صحيحاً أكبر من صفر.');return}if(!details){show('اكتب تفاصيل الطلب.');return}$('send').disabled=true;$('send').textContent='جاري إرسال الطلب...';try{const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,amount,details})});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر رجّع صفحة بدل الاستجابة المطلوبة.');const x=await r.json();if(!r.ok||!x.ok)throw Error(x.error||'لم يتم إرسال الطلب.');show('تم تجهيز الطلب. اضغط الزر أدناه لإرسال رسالة واتساب لصاحب التطبيق.');const a=document.createElement('a');a.className='btn';a.href=x.whatsappUrl;a.target='_blank';a.rel='noopener';a.textContent='فتح واتساب وإرسال الطلب';$('msg').appendChild(document.createElement('br'));$('msg').appendChild(a);$('amount').disabled=true;$('details').disabled=true;$('send').textContent='تم إنشاء الطلب'}catch(e){show(e.message);$('send').disabled=false;$('send').textContent='إرسال الطلب عبر واتساب'}}}catch(e){$('loading').textContent=e.message}}function show(t){$('msg').textContent=t;$('msg').style.display='block'}start();</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
