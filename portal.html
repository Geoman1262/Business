<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769aa"><title>كشف حساب العميل</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#17212b;margin:0;padding:16px}.wrap{max-width:760px;margin:auto}.head,.card{background:#fff;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #10243a0c}.head{background:#1769aa;color:#fff}.muted{color:#64748b;font-size:13px}.head .muted{color:#e4f1ff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#edf5fc;padding:12px;border-radius:10px}.stat small{display:block;color:#516579}.stat strong{display:block;margin-top:5px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e5eaf0}.row:last-child{border:0}.badge{font-size:12px;background:#e5f1fc;padding:4px 7px;border-radius:7px}.btn{border:0;border-radius:9px;padding:11px 14px;background:#1769aa;color:white;font:inherit;margin:5px 4px 5px 0}.error{background:#fff0ed;color:#a21b13;padding:15px;border-radius:10px}@media(max-width:480px){.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="head"><h2>دفتر الحساب</h2><div id="name">كشف حساب العميل</div><div class="muted" id="updated">جارٍ تحميل الحساب…</div></header><div id="app"><p class="muted">جارٍ تحميل البيانات…</p></div></div><script>
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})+' $';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const date=ts=>{const d=new Date(Number(ts));return isNaN(d)?'—':d.toLocaleString('ar-LB')};let account=null, clientName='';
async function load(){const token=new URLSearchParams(location.search).get('token');if(!token){document.getElementById('app').innerHTML='<div class="error">الرابط غير صالح.</div>';return}try{const r=await fetch('/api/portal?token='+encodeURIComponent(token),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'تعذّر تحميل الحساب');account=j.account;clientName=j.name;document.getElementById('name').textContent='حساب: '+j.name;document.getElementById('updated').textContent='آخر تحديث: '+new Date(j.updatedAt).toLocaleString('ar-LB');render()}catch(e){document.getElementById('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(){const asc=Array.isArray(account.entries)?account.entries.slice().sort((a,b)=>Number(a.ts)-Number(b.ts)):[];const debts=asc.filter(e=>e.type==='debt');const payments=asc.filter(e=>e.type==='payment');const paid={};debts.forEach(d=>paid[d.id]=0);const alloc={};for(const p of payments){let left=Math.max(0,Number(p.amount)||0);const rows=[];for(const d of debts){if(Number(d.ts)>Number(p.ts)||left<=0)continue;const rem=Math.max(0,Math.round((Number(d.amount)-paid[d.id])*100)/100);if(!rem)continue;const amount=Math.min(left,rem);rows.push({id:d.id,note:d.note||'بضاعة / دين',amount});paid[d.id]=Math.round((paid[d.id]+amount)*100)/100;left=Math.round((left-amount)*100)/100;}alloc[p.id]={rows,left};}let debtTotal=debts.reduce((s,e)=>s+(Number(e.amount)||0),0),payTotal=payments.reduce((s,e)=>s+(Number(e.amount)||0),0);const balance=Math.max(0,Math.round((debtTotal-payTotal)*100)/100);const entries=asc.slice().reverse();document.getElementById('app').innerHTML='<div class="card stats"><div class="stat"><small>إجمالي الديون / البضاعة</small><strong>'+money(debtTotal)+'</strong></div><div class="stat"><small>إجمالي الدفعات</small><strong>'+money(payTotal)+'</strong></div><div class="stat"><small>الرصيد المتبقي</small><strong>'+money(balance)+'</strong></div></div><div class="card"><h3>كل دولار إله قصة — سجل العمليات</h3><div>'+ (entries.length?entries.map(e=>{const isDebt=e.type==='debt';const remaining=isDebt?Math.max(0,Math.round((Number(e.amount)-(paid[e.id]||0))*100)/100):0;const extra=isDebt
 ? '<div class="muted">رقم الدين: #'+esc('D'+String(debts.filter(x=>Number(x.ts)<Number(e.ts)||(Number(x.ts)===Number(e.ts)&&String(x.id)<=String(e.id))).length).padStart(3,'0'))+' · مدفوع: '+money(paid[e.id]||0)+' · متبقي من الدين: '+money(remaining)+'</div>'
 : ((alloc[e.id]?.rows||[]).length
    ? '<details open><summary>تفاصيل توزيع الدفعة — '+esc('P'+String(payments.filter(x=>Number(x.ts)<Number(e.ts)||(Number(x.ts)===Number(e.ts)&&String(x.id)<=String(e.id))).length).padStart(3,'0'))+'</summary><ul>'+alloc[e.id].rows.map(a=>{const debt=debts.find(d=>d.id===a.id);const debtSerial=debt?'D'+String(debts.filter(x=>Number(x.ts)<Number(debt.ts)||(Number(x.ts)===Number(debt.ts)&&String(x.id)<=String(debt.id))).length).padStart(3,'0'):'—';const debtPaid=debt?(paid[debt.id]||0):0;const debtRemaining=debt?Math.max(0,Math.round((Number(debt.amount)-debtPaid)*100)/100):0;return '<li><strong>الدين #'+esc(debtSerial)+'</strong> — '+esc(a.note)+'<br>المبلغ المخصّص من الدفعة: '+money(a.amount)+(debt?'<br>تاريخ الدين: '+date(debt.ts)+'<br>قيمة الدين الأصلية: '+money(debt.amount)+' · المدفوع إجمالاً: '+money(debtPaid)+' · المتبقي حالياً: '+money(debtRemaining):'')+'</li>'}).join('')+'</ul>'+(alloc[e.id].left>0?'<div class="muted">مبلغ غير مخصص: '+money(alloc[e.id].left)+'</div>':'')+'</details>'
    : '<div class="muted">رقم الدفعة: #'+esc('P'+String(payments.filter(x=>Number(x.ts)<Number(e.ts)||(Number(x.ts)===Number(e.ts)&&String(x.id)<=String(e.id))).length).padStart(3,'0'))+' · لا يوجد دين سابق يمكن تخصيص هذه الدفعة له.</div>');return '<div class="row"><div><span class="badge">'+(isDebt?'دين / بضاعة':'دفعة')+'</span><div style="margin-top:7px">'+esc(e.note||(isDebt?'بضاعة / دين':'دفعة مالية'))+'</div><div class="muted">'+date(e.ts)+' · #'+esc(String(isDebt?'D':'P')+String(asc.filter(x=>x.type===e.type&&Number(x.ts)<=Number(e.ts)).length).padStart(3,'0'))+'</div>'+extra+'</div><strong>'+(isDebt?'+':'−')+money(e.amount)+'</strong></div>'}).join(''):'<p class="muted">لا توجد عمليات مسجلة.</p>')+'</div><button class="btn" onclick="exportCSV()">تصدير CSV / Excel</button><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button><p class="muted">هذه الصفحة للعرض فقط. لأي تصحيح، تواصل مع صاحب الحساب.</p></div>'}
function exportCSV(){const rows=[['كشف حساب',clientName],['النوع','التاريخ','الوصف','المبلغ']];for(const e of (account.entries||[])){rows.push([e.type==='debt'?'دين / بضاعة':'دفعة',date(e.ts),e.note||'',e.amount])}const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='كشف-حساب.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}load();setInterval(load,30000);
</script></body></html>
