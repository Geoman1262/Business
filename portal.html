<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><title>حساب العميل | دفتر الحساب</title><style>body{margin:0;background:#f3f6fb;color:#17243a;font-family:system-ui,Tahoma,sans-serif}.top{background:#10233f;color:white;padding:20px}.wrap{max-width:700px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #e0e7f1;border-radius:16px;padding:18px;margin-bottom:15px}input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:10px;box-sizing:border-box}input,textarea{border:1px solid #cbd5e1;margin:5px 0 12px}button{border:0;background:#1c65d8;color:white;font-weight:700;cursor:pointer}.muted{color:#65758c;font-size:13px}.balance{font-size:27px;font-weight:800}.hidden{display:none}.status{background:#edf5ff;padding:11px;border-radius:10px;white-space:pre-wrap}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:9px;border-bottom:1px solid #e8edf4;font-size:14px}</style></head><body><header class="top"><h1>حساب العميل</h1><div id="who">جاري تحميل الحساب…</div></header><main class="wrap"><section id="account" class="card hidden"><div class="muted">الرصيد الحالي</div><div id="balance" class="balance">$0.00</div><div class="muted" id="limit"></div><h2>إرسال طلب جديد</h2><p class="muted">إرسال الطلب لا يضيف ديناً إلى حسابك. صاحب الحساب يراجعه أولاً.</p><label for="amount">المبلغ بالدولار</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="المبلغ"><label for="details">تفاصيل الطلب</label><textarea id="details" rows="3" placeholder="اكتب تفاصيل الطلب"></textarea><button id="send">إرسال الطلب إلى صاحب الحساب</button><div id="msg" class="status hidden" style="margin-top:12px"></div></section><section id="history" class="card hidden"><h2>آخر الحركات</h2><div id="entries"></div></section><section id="error" class="card hidden"></section></main><script>const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';let wa='';async function start(){try{const r=await fetch('/api/portal?token='+encodeURIComponent(token));const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر لم يُرجع JSON. تأكد من نشر Worker الجديد.');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذّر فتح الحساب.');$('who').textContent=d.name;$('balance').textContent='$'+Number(d.balance||0).toFixed(2);$('limit').textContent='الحد الائتماني: $'+Number(d.account.creditLimit||0).toFixed(2);$('account').classList.remove('hidden');$('history').classList.remove('hidden');const es=[...(d.account.entries||[])].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,10);if(!es.length)$('entries').textContent='لا توجد حركات مسجلة.';else{const t=document.createElement('table');t.innerHTML='<thead><tr><th>التاريخ</th><th>التفاصيل</th><th>المبلغ</th></tr></thead><tbody></tbody>';es.forEach(e=>{const tr=document.createElement('tr');[e.ts?new Date(e.ts).toLocaleDateString('ar-LB'):'—',e.note||'',(e.type==='payment'?'-':'')+'$'+Number(e.amount||0).toFixed(2)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});t.querySelector('tbody').append(tr)});$('entries').append(t)}}catch(e){$('who').textContent='تعذّر فتح الحساب';$('error').classList.remove('hidden');$('error').textContent=e.message}}
function show(t,good=true){$('msg').classList.remove('hidden');$('msg').textContent=t;$('msg').style.background=good?'#edf5ff':'#fff0f0'}$('send').onclick=async()=>{const btn=$('send');btn.disabled=true;try{const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,amount:$('amount').value,details:$('details').value})});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر لم يُرجع JSON. أوقف الإرسال وأعد نشر Worker الصحيح.');const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'تعذّر إرسال الطلب.');show('تم إنشاء الطلب. سيتم فتح واتساب لإرسال إشعار لصاحب الحساب.');location.href=d.whatsappUrl}catch(e){show(e.message,false)}finally{btn.disabled=false}};start();</script></body></html>
