<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>My Credit Account</title>
<style>
:root{color-scheme:dark;--bg:#061329;--panel:rgba(10,32,68,.60);--line:rgba(190,224,255,.35);--white:#f5f9ff;--muted:#b4c9e8;--blue:#087dff;--cyan:#00d9ff;--green:#00e6a1;--red:#ff5a67}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,"Noto Sans Arabic",sans-serif;color:var(--white);background:radial-gradient(ellipse at 20% 5%,#1558a5 0,transparent 38%),radial-gradient(ellipse at 85% 35%,#143d7b 0,transparent 40%),radial-gradient(ellipse at 65% 95%,#123e72 0,transparent 38%),linear-gradient(145deg,#030b1b,#081a37 55%,#041024);background-attachment:fixed;padding:18px 13px 34px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 42%,#4b9dff25,transparent 18%),radial-gradient(circle at 92% 72%,#80cfff20,transparent 22%);backdrop-filter:blur(12px)}.wrap{position:relative;max-width:720px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:4px 2px 18px}.brand{font-size:23px;font-weight:800;letter-spacing:-.4px;flex:1}.gear{border:1px solid var(--line);background:#ffffff12;color:white;border-radius:14px;padding:10px 12px;font-size:18px}.lang{display:flex;padding:4px;border:1px solid var(--line);border-radius:99px;background:#071b38cc;gap:3px}.lang button{border:0;border-radius:99px;padding:9px 13px;color:#d8e9ff;background:transparent;font-weight:800}.lang button.active{background:linear-gradient(120deg,#087dff,#0060d9);color:#fff}.sub{color:var(--muted);font-size:13px;margin:-8px 4px 16px}.glass{background:linear-gradient(130deg,rgba(255,255,255,.20),rgba(77,145,224,.08) 40%,rgba(5,26,59,.65));border:1px solid rgba(210,237,255,.66);border-radius:27px;box-shadow:inset 0 1px 0 #ffffff90,0 0 22px #168bff35,0 16px 45px #0005;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.credit{padding:24px 22px 20px;overflow:hidden;position:relative}.credit:before{content:"";position:absolute;left:-12%;right:-10%;top:22%;height:130px;border-top:1px solid #3caaff99;border-radius:50%;transform:rotate(-9deg);box-shadow:0 -7px 22px #168dff18;pointer-events:none}.limit-label{color:#c3dafa;font-size:15px}.limit{font-size:clamp(38px,8vw,56px);font-weight:900;letter-spacing:-1.2px;margin:3px 0 18px;position:relative}.credit-icon{position:absolute;right:22px;top:28px;font-size:31px;color:#d8edff;opacity:.9}.bar-shell{position:relative;border:1px solid #c7e7ff80;border-radius:99px;padding:5px;background:#a7d6ff18;box-shadow:inset 0 2px 10px #00132d80}.bar-track{height:31px;border-radius:99px;background:#081a35aa;overflow:hidden}.bar-fill{height:100%;width:0;background:linear-gradient(90deg,#00eaa2,#00d4ff);border-radius:99px;box-shadow:0 0 20px #00d8ff88;transition:width .3s}.bar-caption{display:flex;justify-content:space-between;gap:8px;margin:9px 2px 18px;color:#d7e9ff;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.stat{padding:0 10px;border-inline-start:1px solid #b8d9ff45;min-width:0}.stat:first-child{border-inline-start:0}.stat small{display:block;color:#b8d0f0;font-size:12px;line-height:1.35}.stat strong{display:block;font-size:clamp(19px,4.5vw,28px);margin-top:6px;overflow-wrap:anywhere}.green{color:var(--green)}.red{color:var(--red)}.alert{display:none;margin-top:15px;padding:11px 13px;border-radius:12px;background:#ff5a671b;border:1px solid #ff697a80;color:#ffd9df;font-weight:800}.alert.show{display:block}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0 12px}.tabs button{padding:13px 5px;border-radius:15px;border:1px solid #b7d9ff40;color:#e8f3ff;background:#ffffff0d;font:inherit;font-size:13px;font-weight:700;backdrop-filter:blur(12px)}.tabs button.active{background:linear-gradient(115deg,#087dff,#00a9ff);border-color:#49d8ff;box-shadow:0 0 16px #087dff50}.transactions{padding:8px 15px}.tx{border-bottom:1px solid #b8d7ff32}.tx:last-child{border-bottom:0}.tx summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:43px minmax(0,1fr) auto 15px;gap:10px;align-items:center;padding:14px 0}.tx summary::-webkit-details-marker{display:none}.txicon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#8abaff24;font-size:21px}.txicon.payment{background:#00dfa226;color:var(--green);border-radius:50%}.tx-title{font-weight:800;font-size:14px}.tx-date{color:var(--muted);font-size:12px;margin-top:4px}.tx-amount{font-size:17px;font-weight:900;white-space:nowrap}.chevron{color:#a8c9f7;font-size:21px}.tx[open] .chevron{transform:rotate(90deg)}.tx-detail{padding:0 3px 15px 53px;color:#d2e3fb;font-size:13px;line-height:1.8}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}.detail-box{background:#ffffff0b;border:1px solid #b8d7ff22;border-radius:10px;padding:9px;min-width:0}.detail-box small{display:block;color:#a9c4e7;font-size:11px}.detail-box strong{overflow-wrap:anywhere}.empty,.error{padding:22px;text-align:center;color:#c5d8f4}.error{border:1px solid #ff879066;background:#ff5a6715;border-radius:14px}.footer{text-align:center;color:#8da9d0;font-size:12px;margin:15px 8px}.settings-panel{display:none;padding:15px;margin-top:12px}.settings-panel.show{display:block}.settings-panel p{color:#bfd4f2;font-size:13px;line-height:1.6}.hidden{display:none!important}body[dir="rtl"] .tx-detail{padding:0 53px 15px 3px}body[dir="rtl"] .credit-icon{right:auto;left:22px}@media(max-width:420px){body{padding:12px 9px}.credit{padding:20px 15px 17px}.stats{gap:3px}.stat{padding:0 6px}.stat small{font-size:11px}.tx summary{grid-template-columns:37px minmax(0,1fr) auto 10px;gap:7px}.txicon{width:35px;height:35px}.tx-amount{font-size:15px}.transactions{padding:5px 10px}.tx-detail{padding-left:44px}}@media print{body{background:#fff;color:#111}.glass,.transactions,.settings-panel{background:#fff!important;color:#111;box-shadow:none;border:1px solid #bbb;backdrop-filter:none}.top .gear,.lang,.tabs,.footer{display:none}.muted,.sub,.stat small,.tx-date,.tx-detail{color:#444}}
</style></head>
<body dir="ltr"><div class="wrap"><div class="top"><div class="brand" id="brand">My Credit Account</div><button class="gear" id="settingsBtn" aria-label="Settings">⚙</button><div class="lang"><button id="enBtn" class="active" type="button">EN</button><button id="arBtn" type="button">عربي</button></div></div><div class="sub" id="updated">Loading account…</div><main id="app"><div class="glass empty">Loading credit account…</div></main><div class="footer" id="footer">View-only account · Contact the account owner for corrections.</div></div>
<script>
const I18N={en:{brand:'My Credit Account',loading:'Loading account…',limit:'Credit Limit',used:'Used Credit',available:'Available Credit',remaining:'remaining',usedPct:'used',limitReached:'LIMIT REACHED',exceeded:'LIMIT EXCEEDED',overBy:'Over limit by',all:'All',purchases:'Purchases',payments:'Payments',purchase:'Purchase / Debt',payment:'Payment',date:'Date',amount:'Amount',description:'Description',serial:'Reference',balanceAfter:'Balance after this transaction',currentDebt:'Current debt',paid:'Paid toward this debt',left:'Remaining on this debt',status:'Status',fullyPaid:'Paid in full',partPaid:'Partially paid',paymentAllocation:'Payment allocation',allocated:'Allocated to',noNote:'No description provided',empty:'No transactions recorded yet.',footer:'View-only account · Contact the account owner for corrections.',settings:'Display settings',settingsText:'This page is read-only. Only the account owner can change the credit limit, debts, and payments.',lastUpdate:'Last updated'},ar:{brand:'بطاقة الحساب الائتماني',loading:'جارٍ تحميل الحساب…',limit:'الحد الائتماني',used:'الدين المستخدم',available:'المتاح للشراء',remaining:'متبقٍ',usedPct:'مستخدم',limitReached:'تم بلوغ الحد الائتماني',exceeded:'تجاوز الحد الائتماني',overBy:'التجاوز بقيمة',all:'الكل',purchases:'المشتريات',payments:'الدفعات',purchase:'شراء / دين',payment:'دفعة',date:'التاريخ',amount:'المبلغ',description:'الوصف',serial:'الرقم المرجعي',balanceAfter:'الرصيد بعد هذه العملية',currentDebt:'الدين الحالي',paid:'المسدّد من هذا الدين',left:'المتبقي من هذا الدين',status:'الحالة',fullyPaid:'مسدّد بالكامل',partPaid:'مسدّد جزئياً',paymentAllocation:'توزيع الدفعة',allocated:'مخصّص للدين',noNote:'لا يوجد وصف للعملية',empty:'لا توجد عمليات مسجّلة بعد.',footer:'هذه الصفحة للعرض فقط · تواصل مع صاحب الحساب لتصحيح أي حركة.',settings:'إعدادات العرض',settingsText:'هذه الصفحة للعرض فقط. صاحب الحساب وحده يستطيع تعديل الحد الائتماني والديون والدفعات.',lastUpdate:'آخر تحديث'}};
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let account=null,clientName='',language=localStorage.getItem('debt_portal_language_v1')||'en',filter='all',token='';const $=id=>document.getElementById(id);const t=k=>I18N[language][k]||k;const date=ts=>{const d=new Date(Number(ts));return isNaN(d)?'—':d.toLocaleString(language==='ar'?'ar-LB':'en-US',{dateStyle:'medium',timeStyle:'short'})};
function setLanguage(lang){language=lang;localStorage.setItem('debt_portal_language_v1',lang);document.documentElement.lang=lang==='ar'?'ar':'en';document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=document.documentElement.dir;$('enBtn').classList.toggle('active',lang==='en');$('arBtn').classList.toggle('active',lang==='ar');if(account)render();else applyStatic();}
function applyStatic(){$('brand').textContent=t('brand');$('footer').textContent=t('footer');$('updated').textContent=t('loading');}
$('enBtn').onclick=()=>setLanguage('en');$('arBtn').onclick=()=>setLanguage('ar');window.settingsOpen=false;$('settingsBtn').onclick=()=>{window.settingsOpen=!window.settingsOpen;const panel=$('settingsPanel');if(panel)panel.classList.toggle('show',window.settingsOpen);};
function calc(){const entries=(Array.isArray(account.entries)?account.entries:[]).slice().sort((a,b)=>Number(a.ts)-Number(b.ts));const debts=entries.filter(e=>e.type==='debt'),payments=entries.filter(e=>e.type==='payment');const paid={};debts.forEach(d=>paid[d.id]=0);const allocations={};for(const p of payments){let left=Math.max(0,Number(p.amount)||0);const rows=[];for(const d of debts){if(Number(d.ts)>Number(p.ts)||left<=0)continue;const rem=Math.max(0,Math.round((Number(d.amount)-paid[d.id])*100)/100);if(!rem)continue;const amount=Math.min(left,rem);rows.push({debtId:d.id,note:d.note||'',amount});paid[d.id]=Math.round((paid[d.id]+amount)*100)/100;left=Math.round((left-amount)*100)/100;}allocations[p.id]={rows,left};}let running=0;const runningAfter={};for(const e of entries){running=Math.round((running+(e.type==='debt'?1:-1)*Number(e.amount||0))*100)/100;runningAfter[e.id]=Math.max(0,running)}const balance=Math.max(0,Math.round((debts.reduce((s,e)=>s+Number(e.amount||0),0)-payments.reduce((s,e)=>s+Number(e.amount||0),0))*100)/100);return{entries,debts,payments,paid,allocations,runningAfter,balance,debtTotal:debts.reduce((s,e)=>s+Number(e.amount||0),0),payTotal:payments.reduce((s,e)=>s+Number(e.amount||0),0)}}
function serial(e,L){const rows=L.entries.filter(x=>x.type===e.type);return(e.type==='debt'?'D':'P')+String(rows.findIndex(x=>x.id===e.id)+1).padStart(3,'0')}
function render(){const L=calc(),limit=Math.max(0,Number(account.creditLimit)||0),used=L.balance,available=Math.max(0,limit-used),remainingPct=limit>0?Math.max(0,Math.min(100,available/limit*100)):0,usedPct=limit>0?Math.min(100,used/limit*100):0,over=Math.max(0,used-limit);const entries=L.entries.slice().reverse();let html=`<section class="glass credit"><div class="limit-label">${t('limit')}</div><div class="limit">${money(limit)}</div><div class="credit-icon">▣</div><div class="bar-shell" aria-label="${Math.round(remainingPct)}% ${t('remaining')}"><div class="bar-track"><div class="bar-fill" style="width:${remainingPct}%"></div></div></div><div class="bar-caption"><span>${Math.round(remainingPct)}% ${t('remaining')}</span><span>${Math.round(usedPct)}% ${t('used')}</span></div><div class="stats"><div class="stat"><small>${t('used')}</small><strong>${money(used)}</strong></div><div class="stat"><small>${t('available')}</small><strong class="green">${money(available)}</strong></div><div class="stat"><small>${t('remaining')}</small><strong>${Math.round(remainingPct)}% <span style="font-size:14px;color:#d3e6ff">(${money(available)})</span></strong></div></div>${over>0?`<div class="alert show">${t('exceeded')} · ${t('overBy')} ${money(over)}</div>`:limit>0&&used>=limit?`<div class="alert show">${t('limitReached')} · 100% USED</div>`:''}${limit===0?`<div class="alert show" style="display:block;background:#ffffff10;border-color:#b9dcff55">${language==='ar'?'لم يحدّد صاحب الحساب حداً ائتمانياً بعد.':'The account owner has not set a credit limit yet.'}</div>`:''}</section><div class="tabs"><button data-filter="all" class="${filter==='all'?'active':''}">${t('all')}</button><button data-filter="debt" class="${filter==='debt'?'active':''}">${t('purchases')}</button><button data-filter="payment" class="${filter==='payment'?'active':''}">${t('payments')}</button></div><section class="glass transactions">`;
const shown=entries.filter(e=>filter==='all'||e.type===filter);if(!shown.length)html+=`<div class="empty">${t('empty')}</div>`;for(const e of shown){const debt=e.type==='debt',amount=Number(e.amount)||0,balAfter=L.runningAfter[e.id]||0;let detail=`<div class="detail-grid"><div class="detail-box"><small>${t('serial')}</small><strong>${serial(e,L)}</strong></div><div class="detail-box"><small>${t('date')}</small><strong>${esc(date(e.ts))}</strong></div><div class="detail-box"><small>${t('amount')}</small><strong>${money(amount)}</strong></div><div class="detail-box"><small>${t('balanceAfter')}</small><strong>${money(balAfter)}</strong></div><div class="detail-box" style="grid-column:1/-1"><small>${t('description')}</small><strong>${esc(e.note||t('noNote'))}</strong></div></div>`;
if(debt){const paid=L.paid[e.id]||0,rem=Math.max(0,Math.round((amount-paid)*100)/100);detail+=`<div class="detail-grid"><div class="detail-box"><small>${t('paid')}</small><strong>${money(paid)}</strong></div><div class="detail-box"><small>${t('left')}</small><strong>${money(rem)}</strong></div><div class="detail-box" style="grid-column:1/-1"><small>${t('status')}</small><strong>${rem<=0?t('fullyPaid'):t('partPaid')}</strong></div></div>`;const linked=L.payments.map(p=>({p,amount:(L.allocations[p.id]?.rows||[]).filter(a=>a.debtId===e.id).reduce((s,a)=>s+a.amount,0)})).filter(x=>x.amount>0);if(linked.length)detail+=`<strong>${t('payments')}:</strong><ul>${linked.map(x=>`<li>${esc(date(x.p.ts))} · ${money(x.amount)}${x.p.note?' · '+esc(x.p.note):''}</li>`).join('')}</ul>`}
else{const al=L.allocations[e.id]||{rows:[],left:0};detail+=`<strong>${t('paymentAllocation')}:</strong>${al.rows.length?`<ul>${al.rows.map(a=>{const d=L.debts.find(x=>x.id===a.debtId);return `<li>${t('allocated')} #${d?serial(d,L):'—'} · ${esc(a.note||t('purchase'))}: ${money(a.amount)}</li>`}).join('')}</ul>`:`<p>${language==='ar'?'لا يوجد دين سابق لتوزيع هذه الدفعة عليه.':'No earlier debt was available for this payment.'}</p>`}`;if(al.left>0.001)detail+=`<p>${language==='ar'?'مبلغ غير موزّع':'Unallocated amount'}: ${money(al.left)}</p>`}
html+=`<details class="tx"><summary><span class="txicon ${debt?'':'payment'}">${debt?'🛒':'⬆'}</span><span><div class="tx-title">${debt?t('purchase'):t('payment')}</div><div class="tx-date">${esc(date(e.ts))} · #${serial(e,L)}</div></span><strong class="tx-amount ${debt?'red':'green'}">${debt?'−':'+'}${money(amount)}</strong><span class="chevron">›</span></summary><div class="tx-detail">${detail}</div></details>`}
html+=`</section><section id="settingsPanel" class="glass settings-panel"><strong>${t('settings')}</strong><p>${t('settingsText')}</p></section>`;$('app').innerHTML=html;$('app').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('settingsPanel').classList.toggle('show',window.settingsOpen===true);}
async function load(){token=new URLSearchParams(location.search).get('token')||'';if(!token){$('app').innerHTML='<div class="error">Invalid customer link.</div>';return}try{const r=await fetch('/api/portal?token='+encodeURIComponent(token),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Could not load account');account=j.account;clientName=j.name;$('updated').textContent=t('lastUpdate')+': '+new Date(j.updatedAt).toLocaleString(language==='ar'?'ar-LB':'en-US');render()}catch(e){$('app').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
applyStatic();setLanguage(language);load();setInterval(load,30000);
</script></body></html>
