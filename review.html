<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10233f"><title>مراجعة طلب | دفتر الحساب</title><style>body{margin:0;background:#f3f6fb;color:#17243a;font-family:system-ui,Tahoma,sans-serif}.top{background:#10233f;color:white;padding:20px}.wrap{max-width:700px;margin:20px auto;padding:0 14px}.card{background:white;border:1px solid #e0e7f1;border-radius:16px;padding:18px;margin-bottom:15px}label{display:block;font-weight:700;margin:10px 0 5px}input{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}button{font:inherit;border:0;border-radius:10px;padding:12px 15px;background:#1c65d8;color:white;font-weight:700;cursor:pointer}button.red{background:#c83745}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#65758c;font-size:13px}.status{padding:11px;border-radius:10px;background:#edf5ff;white-space:pre-wrap}.hidden{display:none}.big{font-size:24px;font-weight:800}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><h1>مراجعة طلب العميل</h1><div id="subtitle">جاري تحميل الطلب…</div></header><main class="wrap"><section class="card" id="orderBox"><div id="details" class="muted">الرجاء الانتظار…</div></section><section class="card"><h2>دخول صاحب التطبيق</h2><label for="key">ADMIN_KEY</label><input id="key" type="password" placeholder="رمز دخول صاحب التطبيق"><p class="muted">يُستخدم الرمز فقط للتحقق قبل الموافقة أو الرفض.</p><div class="grid"><button id="approve">موافقة وتسجيل الدين</button><button id="reject" class="red">رفض الطلب</button></div><div id="msg" class="status hidden" style="margin-top:12px"></div></section></main><script>const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token')||'';let orderData=null;async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if($('key').value.trim())headers['X-Admin-Key']=$('key').value.trim();const r=await fetch(path,{...opts,headers});const ct=r.headers.get('content-type')||'';if(!ct.includes('application/json'))throw Error('السيرفر رجّع HTML بدل JSON. تأكد من نشر Worker الجديد.');const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'حدث خطأ');return d}function status(t,ok=true){$('msg').classList.remove('hidden');$('msg').textContent=t;$('msg').style.background=ok?'#edf5ff':'#fff0f0'}async function load(){try{orderData=await api('/api/review?token='+encodeURIComponent(token));const o=orderData.order;$('subtitle').textContent='العميل: '+o.client_name;$('details').innerHTML='';[['اسم العميل',o.client_name],['رقم الهاتف',o.client_phone||'—'],['المبلغ المطلوب','$'+Number(o.amount).toFixed(2)],['التفاصيل',o.details],['الرصيد الحالي','$'+Number(orderData.balance).toFixed(2)],['الحد الائتماني','$'+Number(orderData.creditLimit).toFixed(2)],['المتاح حالياً','$'+Number(orderData.available).toFixed(2)],['حالة الطلب',o.status],['تاريخ الطلب',new Date(o.created_at).toLocaleString('ar-LB')]].forEach(([k,v])=>{const p=document.createElement('p');p.innerHTML='<b></b>: <span></span>';p.querySelector('b').textContent=k;p.querySelector('span').textContent=v;$('details').append(p)});if(o.status!=='pending'){$('approve').disabled=true;$('reject').disabled=true;status('هذا الطلب تمت معالجته سابقاً: '+o.status,false)}}catch(e){$('subtitle').textContent='تعذّر تحميل الطلب';status(e.message,false)}}async function act(action){if(!$('key').value.trim()){status('أدخل ADMIN_KEY أولاً.',false);return}if(action==='approve'&&!confirm('تأكيد الموافقة؟ سيتم تسجيل الدين مرة واحدة.'))return;if(action==='reject'&&!confirm('تأكيد رفض الطلب؟ لن يُضاف أي دين.'))return;$('approve').disabled=$('reject').disabled=true;try{await api('/api/review',{method:'POST',body:JSON.stringify({token,action})});status(action==='approve'?'تمت الموافقة وتسجيل الدين.':'تم رفض الطلب ولم يُضف أي دين.');$('subtitle').textContent=action==='approve'?'تمت الموافقة':'تم الرفض'}catch(e){status(e.message,false);$('approve').disabled=$('reject').disabled=false}}$('approve').onclick=()=>act('approve');$('reject').onclick=()=>act('reject');load();</script></body></html>
